name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Debian 12 (Standard-Vorlage) bringt Python 3.11, Debian 13 bringt 3.13
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Statische Prüfung
        run: ruff check --select F,E9 backend tests
      - name: Tests (gegen ein Schein-Immich, alte und neue API)
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript auf Syntaxfehler prüfen
        run: for f in frontend/app.js frontend/theme.js frontend/js/*.js frontend/js/views/*.js; do node --check "$f" || exit 1; done

  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Skripte prüfen
        run: |
          bash -n install.sh
          bash -n proxmox/create-lxc.sh
          grep -q '^[0-9]\+\.[0-9]\+\.[0-9]\+$' VERSION
